name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Image branch to build (empty = all)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare (base projects only)
        run: make prepare
        continue-on-error: true

      - name: Build and push
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            make publishx BRANCH="${{ inputs.branch }}"
          else
            make publishx-all
          fi

      - name: Tag stable (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            make tag-stable BRANCH="${{ inputs.branch }}"
          else
            # Tag all images as stable
            python3 third_party/docker-builder/build.py list --project-root=. | \
              grep -oP '[\w/\-]+' | while read branch; do
                make tag-stable BRANCH="$branch" || true
              done
          fi
