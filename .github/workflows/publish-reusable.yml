name: Publish (reusable)

on:
  workflow_call:
    inputs:
      type:
        description: 'Image project type: "base" (single image + tag-stable) or "derived" (multi-image)'
        required: true
        type: string
      branch:
        description: 'Image branch to build (derived only, empty = all)'
        required: false
        default: ''
        type: string
      lineup:
        description: 'Lineup to build (empty = all lineups)'
        required: false
        default: ''
        type: string
      node-version:
        description: 'Node.js version for frontend build (base projects only, empty = skip)'
        required: false
        default: ''
        type: string
      tag-stable:
        description: 'Whether to tag stable on v* tag push'
        required: false
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        lineup: ${{ inputs.lineup != '' && fromJSON(format('["{0}"]', inputs.lineup)) || fromJSON('["base", "ascend"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Prepare
        run: make prepare

      - name: Build and push (base)
        if: inputs.type == 'base'
        run: make publishx LINEUP=${{ matrix.lineup }}

      - name: Build and push (derived)
        if: inputs.type == 'derived'
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            make publishx BRANCH="${{ inputs.branch }}" LINEUP=${{ matrix.lineup }}
          else
            make publishx-all LINEUP=${{ matrix.lineup }}
          fi

      - name: Tag stable
        if: inputs.tag-stable && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: make tag-stable LINEUP=${{ matrix.lineup }}
